<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LLOYD JEFFERSON</title>
    <link rel="stylesheet" href="./css/header.css">
</head>
<body>
    <header class="header">
        <div class="container">
            <div class="header-left">
                <a href="/" class="logo">
                    <span class="logo-text">LLOYD</span>
                    <span class="logo-accent">JEFFERSON</span><span class="logo-dot">.</span>
                </a>
            </div>
            <nav class="nav">
                <div class="nav-wrapper">
                    <div class="switch-wrapper">
                        <button type="button" class="switch" aria-label="Toggle theme">
                            <svg class="switch-bg">
                                <use href="./images/header/sprite.svg#switch-bg"></use>
                            </svg>
                            <svg class="switch-circle">
                                <use href="./images/header/sprite.svg#switch-circle"></use>
                            </svg>
                        </button>
                    </div>
                    <ul class="nav-list">
                        <li class="nav-item"><a href="#about" class="nav-link">About me</a></li>
                        <li class="nav-item"><a href="#projects" class="nav-link">Projects</a></li>
                        <li class="nav-item"><a href="#contacts" class="nav-link">Contacts</a></li>
                    </ul>
                </div>
            </nav>
            <div class="menu-buttons">
                <button type="button" class="burger-menu" aria-label="Toggle menu">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
                <button type="button" class="mobile-close" aria-label="Close menu">
                    <svg class="close-icon">
                        <use href="./images/header/sprite.svg#icon-close"></use>
                    </svg>
                </button>
            </div>
        </div>
    </header>

    <script type="module" src="./js/header.js"></script>
</body>
</html>
